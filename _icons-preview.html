<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
body{background:#fbf3e7;font-family:sans-serif;margin:0;padding:16px}
h3{font-size:13px;color:#7a4a2b;margin:14px 0 6px;letter-spacing:.1em}
.row{display:flex;flex-wrap:wrap;gap:10px}
figure{margin:0;width:88px;text-align:center}
img{width:56px;height:56px;display:block;margin:0 auto}
figcaption{font-size:10px;color:#8a7259;margin-top:3px}
</style></head><body>
<h3>NEW — hand-drawn SVG</h3><div class="row" id="new"></div>
<h3>EXISTING — Streamline PNG</h3><div class="row" id="old"></div>
<script>
const news=["soup","lentils","meatballs","pasta","pan","dumpling","bread","noodles","doughnut","cookie","cheese-dumpling","salad","pickle-jar"];
const olds=["carrot","celery","onion","corn","tomato","cucumber","lettuce","eggplant","drumstick","chicken","pancake","cupcake","candy","pretzel","rollingpin","measuringcup"];
const put=(id,list,ext)=>document.getElementById(id).innerHTML=list.map(n=>
 `<figure><img src="assets/img/icons/${n}.${ext}"><figcaption>${n}</figcaption></figure>`).join("");
put("new",news,"svg"); put("old",olds,"png");
</script></body></html>
